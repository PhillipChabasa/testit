<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<script>
// GitHub Pages SPA redirect trick
// Redirects 404s back to index.html so auth.html works
const path = window.location.pathname;
// Only redirect if not already at root
if (path !== '/' && !path.endsWith('/index.html')) {
  const search = window.location.search;
  const hash   = window.location.hash;
  // For auth.html specifically, pass query params
  const redirect = window.location.href;
  sessionStorage.setItem('gh_pages_redirect', redirect);
  window.location.href = '/';
}
</script>
</head>
<body></body>
</html>
