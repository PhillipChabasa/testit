<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TESTIT — Signing in…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; font-family: 'JetBrains Mono', 'Courier New', monospace;
    background: #000; color: #eef0f8;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; text-align: center; padding: 24px;
  }
  .logo {
    font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #60efbc, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #1f2736; border-top-color: #60efbc;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 13px; color: #8b95b0; line-height: 1.6; max-width: 300px; }
  .error { color: #fb7185; font-size: 12px; max-width: 340px; line-height: 1.6; display: none; }
  .close-btn {
    display: none; margin-top: 8px;
    padding: 10px 24px; background: transparent;
    border: 1.5px solid #28344a; border-radius: 8px;
    color: #8b95b0; font-family: inherit; font-size: 11px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .close-btn:hover { border-color: #3b82f6; color: #3b82f6; }
</style>
</head>
<body>
<div class="logo">TESTIT</div>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Completing sign-in…</div>
<div class="error" id="error-msg"></div>
<button class="close-btn" id="close-btn" onclick="window.close()">Close This Window</button>

<script>
(function() {
  const params   = new URLSearchParams(location.search);
  const code     = params.get('code');
  const state    = params.get('state');
  const errorVal = params.get('error');

  const msgEl    = document.getElementById('msg');
  const errEl    = document.getElementById('error-msg');
  const spinner  = document.getElementById('spinner');
  const closeBtn = document.getElementById('close-btn');

  function showError(msg) {
    spinner.style.display = 'none';
    errEl.style.display = 'block';
    errEl.textContent = msg;
    closeBtn.style.display = 'inline-block';
    msgEl.textContent = 'Authentication failed.';
  }

  if (errorVal) {
    showError('Google declined: ' + errorVal);
    // Still notify parent
    if (window.opener) {
      window.opener.postMessage({ type: 'TESTIT_AUTH', error: errorVal }, location.origin);
    }
    return;
  }

  if (!code) {
    showError('No authorisation code received. Please try again.');
    return;
  }

  if (window.opener) {
    // Normal popup flow — send back to parent
    msgEl.textContent = 'Sending token to TESTIT…';
    window.opener.postMessage({ type: 'TESTIT_AUTH', code, state }, location.origin);
    msgEl.textContent = 'Signed in! This window will close.';
    spinner.style.display = 'none';
    setTimeout(() => window.close(), 1000);
  } else {
    // Redirect flow (popup was blocked) — store in sessionStorage and redirect back
    msgEl.textContent = 'Redirecting back to TESTIT…';
    sessionStorage.setItem('oauth_code',  code);
    sessionStorage.setItem('oauth_state', state || '');
    // Redirect back to the app root
    location.href = location.origin + '/';
  }
})();
</script>
</body>
</html>
